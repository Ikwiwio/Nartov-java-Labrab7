<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Учебные группы — nartov</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body><main class="container py-4"><div class="d-flex justify-content-between align-items-center"><h1 class="h3">Учебные группы</h1><div><a class="btn btn-outline-secondary" th:href="@{/list}">Студенты</a> <a class="btn btn-primary" th:href="@{/groups/new}">Добавить группу</a></div></div><hr><div th:if="${groups.isEmpty()}" class="alert alert-info">Список групп пока пуст.</div><div class="table-responsive"><table class="table table-striped table-bordered align-middle"><thead class="table-light"><tr><th>ID</th><th>Название группы</th><th>Направление</th><th>Курс</th><th>Куратор</th><th>Действия</th></tr></thead><tbody><tr th:each="group : ${groups}"><td th:text="${group.id}"></td><td th:text="${group.groupName}"></td><td th:text="${group.specialty}"></td><td th:text="${group.course}"></td><td th:text="${group.curator}"></td><td><a class="btn btn-sm btn-info" th:href="@{/groups/edit(groupId=${group.id})}">Изменить</a> <a class="btn btn-sm btn-danger" th:href="@{/groups/delete(groupId=${group.id})}" onclick="return confirm('Удалить группу?')">Удалить</a></td></tr></tbody></table></div></main></body></html>
