<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${formTitle}">Студент</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body><main class="container py-4" style="max-width:720px"><h1 class="h3" th:text="${formTitle}">Студент</h1><hr><form th:action="@{/saveStudent}" th:object="${student}" method="post"><input type="hidden" th:field="*{id}"><div class="mb-3"><label class="form-label">Имя</label><input class="form-control" th:field="*{name}" placeholder="Например, Иван"><div class="text-danger small" th:errors="*{name}"></div></div><div class="mb-3"><label class="form-label">Фамилия</label><input class="form-control" th:field="*{surname}"><div class="text-danger small" th:errors="*{surname}"></div></div><div class="mb-3"><label class="form-label">Факультет</label><input class="form-control" th:field="*{faculty}"><div class="text-danger small" th:errors="*{faculty}"></div></div><div class="mb-3"><label class="form-label">Возраст</label><input class="form-control" type="number" th:field="*{age}"><div class="text-danger small" th:errors="*{age}"></div></div><button class="btn btn-primary" type="submit">Сохранить</button> <a class="btn btn-secondary" th:href="@{/list}">Назад</a></form></main></body></html>
