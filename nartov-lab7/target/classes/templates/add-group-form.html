<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${formTitle}">Группа</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body><main class="container py-4" style="max-width:720px"><h1 class="h3" th:text="${formTitle}">Группа</h1><hr><form th:action="@{/groups/save}" th:object="${studyGroup}" method="post"><input type="hidden" th:field="*{id}"><div class="mb-3"><label class="form-label">Название группы</label><input class="form-control" th:field="*{groupName}" placeholder="Например, РТФ-24"><div class="text-danger small" th:errors="*{groupName}"></div></div><div class="mb-3"><label class="form-label">Направление подготовки</label><input class="form-control" th:field="*{specialty}"><div class="text-danger small" th:errors="*{specialty}"></div></div><div class="mb-3"><label class="form-label">Курс</label><input class="form-control" type="number" min="1" max="6" th:field="*{course}"><div class="text-danger small" th:errors="*{course}"></div></div><div class="mb-3"><label class="form-label">Куратор</label><input class="form-control" th:field="*{curator}"><div class="text-danger small" th:errors="*{curator}"></div></div><button class="btn btn-primary" type="submit">Сохранить</button> <a class="btn btn-secondary" th:href="@{/groups}">Назад</a></form></main></body></html>
