<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Студенты — nartov</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body><main class="container py-4"><div class="d-flex justify-content-between align-items-center"><h1 class="h3">Список студентов</h1><div><a class="btn btn-outline-secondary" th:href="@{/groups}">Учебные группы</a> <a class="btn btn-primary" th:href="@{/addStudentForm}">Добавить студента</a></div></div><hr><div th:if="${students.isEmpty()}" class="alert alert-info">Список пока пуст.</div><div class="table-responsive"><table class="table table-striped table-bordered align-middle"><thead class="table-light"><tr><th>ID</th><th>Имя</th><th>Фамилия</th><th>Факультет</th><th>Возраст</th><th>Действия</th></tr></thead><tbody><tr th:each="student : ${students}"><td th:text="${student.id}"></td><td th:text="${student.name}"></td><td th:text="${student.surname}"></td><td th:text="${student.faculty}"></td><td th:text="${student.age}"></td><td><a class="btn btn-sm btn-info" th:href="@{/showUpdateForm(studentId=${student.id})}">Изменить</a> <a class="btn btn-sm btn-danger" th:href="@{/deleteStudent(studentId=${student.id})}" onclick="return confirm('Удалить запись?')">Удалить</a></td></tr></tbody></table></div><hr><p class="text-muted">Actuator: <a href="/actuator/health">health</a> · <a href="/actuator/info">info</a> · <a href="/actuator/metrics">metrics</a></p></main></body></html>
