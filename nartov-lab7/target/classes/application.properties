spring.application.name=nartov-lab7-web
server.port=8080
spring.datasource.url=jdbc:h2:file:./testdb/students;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
management.endpoints.web.exposure.include=health,info,metrics,beans
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=nartov-lab7-web
info.app.description=Thymeleaf web application for students and study groups
info.app.version=1.0.0
